name: VoiceNotes
options:
  bundleIdPrefix: com.voicenotes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 4M6375V4X6
    CODE_SIGN_STYLE: Automatic
packages:
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.2
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.31.3
targets:
  VoiceNotes:
    type: application
    platform: iOS
    sources:
      - path: VoiceNotes
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingyou.voicenotes
        INFOPLIST_FILE: VoiceNotes/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
    scheme:
      testTargets: []
      gatherCoverageData: false
