name: VoiceNotes
options:
  bundleIdPrefix: com.voicenotes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages: {}
# --- Native deps (enable when ready to link; see README) ---
# packages:
#   sherpa-onnx:
#     url: https://github.com/k2-fsa/sherpa-onnx
#     from: 1.12.0
#   mlx-swift:
#     url: https://github.com/ml-explore/mlx-swift
#     from: 0.33.0
#   mlx-swift-lm:
#     url: https://github.com/ml-explore/mlx-swift-lm
#     from: 2.0.0
targets:
  VoiceNotes:
    type: application
    platform: iOS
    sources:
      - path: VoiceNotes
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicenotes.app
        INFOPLIST_FILE: VoiceNotes/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
    # dependencies: []  # wire sherpa-onnx / MLXLLM here after packages enabled
    scheme:
      testTargets: []
      gatherCoverageData: false
