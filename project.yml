name: VoiceNotes
options:
  bundleIdPrefix: com.voicenotes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.2
  # mlx-swift / mlx-swift-lm — enable when wiring OnDeviceEnricher
  # mlx-swift:
  #   url: https://github.com/ml-explore/mlx-swift
  #   from: 0.33.0
  # mlx-swift-lm:
  #   url: https://github.com/ml-explore/mlx-swift-lm
  #   from: 2.0.0
targets:
  VoiceNotes:
    type: application
    platform: iOS
    sources:
      - path: VoiceNotes
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicenotes.app
        INFOPLIST_FILE: VoiceNotes/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
    scheme:
      testTargets: []
      gatherCoverageData: false
